<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} · JigFlow</title>
<style>
/* Glacier: white panels on a faint azure paper, deep blue-teal ink, one
   azure for everything you can act on. Amber keeps meaning human work and
   teal-green finished. The Workflow diagrams sit on drafting-paper dots. */
:root {
  --bg: #f4f9fc; --panel: #ffffff; --text: #0d2b3e; --muted: #5a7486; --line: #d6e6f0; --line-soft: #e8f1f7;
  --accent: #0a86c9; --accent-strong: #0670a8; --accent-soft: #e2f2fb; --on-accent: #ffffff;
  --ok: #0c8467; --ok-soft: #dcf5ec; --bad: #c2343f; --bad-soft: #fde9eb; --warn: #a85a06; --warn-soft: #fff1dc;
  --shadow: 0 1px 2px rgb(13 43 62 / .04), 0 8px 24px -14px rgb(10 134 201 / .28);
  --dot: #cfe3ef;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #081722; --panel: #0e2130; --text: #e4f0f7; --muted: #8aa5b7; --line: #1d3a4e; --line-soft: #163044;
    --accent: #4cb6ee; --accent-strong: #7ccaf4; --accent-soft: #0f3a55; --on-accent: #04202f;
    --ok: #4fd1a5; --ok-soft: #0d3b33; --bad: #ff7a84; --bad-soft: #3d1820; --warn: #f5b454; --warn-soft: #3a2a12;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 28px -16px rgb(0 0 0 / .6);
    --dot: #1a3649;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
header .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
header .name { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
header .name svg { flex: none; }
header .name span { color: var(--muted); font-weight: 450; font-size: 14px; padding-left: 10px; border-left: 1px solid var(--line); }
nav { display: flex; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 5px 14px; border-radius: 7px; }
nav a:hover { color: var(--text); }
nav a[aria-current="page"] { color: var(--accent-strong); background: var(--panel); box-shadow: 0 1px 2px rgb(13 43 62 / .08), 0 0 0 1px var(--line); }
main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 72px; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; margin: 0 0 20px; }
h2 { font-size: 16px; font-weight: 650; letter-spacing: -.005em; margin: 0 0 14px; }
h3 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 12px; }
p { margin: 0 0 10px; }
a { color: var(--accent-strong); text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
a:hover { text-decoration-color: currentColor; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 20px; }
.panel.attention { border-top: 3px solid var(--warn); box-shadow: var(--shadow); }
.panel.problem { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); white-space: pre-wrap; }
.attention-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
.attention-grid > .panel { margin-bottom: 0; }
main > .attention-grid { margin-bottom: 28px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 550; font-size: 12.5px; padding: 7px 10px; background: var(--line-soft); border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child { border-top-left-radius: 8px; }
th:last-child { border-top-right-radius: 8px; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
td.id { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; color: var(--muted); }
td.id a { font-weight: 500; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:target td { background: var(--accent-soft); }
tr:target td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
.pill.agent { background: var(--accent-soft); color: var(--accent-strong); }
.pill.human { background: var(--warn-soft); color: var(--warn); }
.pill.finished { background: var(--ok-soft); color: var(--ok); }
.pill.persona { background: var(--accent-soft); color: var(--accent-strong); font-family: var(--mono); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
ul.plain { list-style: none; padding: 0; margin: 0; }
ol.items { margin: 8px 0 0; padding-left: 22px; font-size: 14px; }
ol.items li { margin-bottom: 4px; }
ol.items li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
.proposal { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.proposal:last-child { margin-bottom: 0; }
.proposal > div:first-child strong { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--accent-strong); margin-right: 4px; }
.proposal form:first-of-type { margin-bottom: 0; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--accent-soft); color: var(--accent-strong); padding: 1px 5px; border-radius: 5px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 13px; color: var(--muted); margin: 0 0 18px; }
.panel.outcome.done { border-color: var(--ok); border-top-width: 3px; }
.panel.outcome.refused { border-color: var(--bad); border-top-width: 3px; }
.panel.outcome.done h2 { color: var(--ok); }
.panel.outcome.refused h2 { color: var(--bad); }
.panel.outcome pre { margin: 0 0 8px; white-space: pre-wrap; font: 13px/1.55 var(--mono); }
.panel.outcome.refused pre:first-of-type { color: var(--bad); }
.note { margin-bottom: 16px; }
button { font: inherit; font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--accent-strong); cursor: pointer; transition: background-color .12s, border-color .12s, color .12s; }
button:hover { border-color: var(--accent); background: var(--accent-soft); }
button:active { transform: translateY(1px); }
button.approve { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; padding: 6px 16px; }
button.approve:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
form.reject button { color: var(--muted); }
form.reject button:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
form.move, form.reject { display: inline-block; margin: 0 4px 4px 0; }
form.reject { margin-top: 10px; }
.proposal form + form.reject { margin-left: 6px; }
.edit { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 10px; font-size: 13px; color: var(--muted); }
.edit input, .edit select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; max-width: 100%; }
.edit input:focus, .edit select:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); outline-offset: 0; }
.edit input[type="text"] { min-width: 8em; }
.changed { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 12px; padding: 10px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--accent); color: var(--text); font-size: 14px; }
.changed a { font-weight: 600; }
.changed[hidden] { display: none; }
.diagram { overflow-x: auto; margin: 0 0 18px; padding: 14px; border: 1px solid var(--line-soft); border-radius: 10px; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size: 16px 16px; background-position: 7px 7px; }
.diagram svg { display: block; max-width: none; }
.diagram .node rect { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; }
.diagram .node.agent rect { fill: var(--accent-soft); stroke: var(--accent); }
.diagram .node.human rect { fill: var(--warn-soft); stroke: var(--warn); }
.diagram .node.final rect { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2.4; }
.diagram .node.initial rect { stroke-width: 2.4; }
.diagram .node text { fill: var(--text); font: 500 13px system-ui, sans-serif; }
.diagram .node text.skill { fill: var(--muted); font: 11px var(--mono); }
.diagram .edge path { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.diagram .edge.human path { stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.8; }
.diagram marker path { fill: var(--muted); }
.diagram marker.human path { fill: var(--warn); }
/* Mockups, previewed in sandboxed frames. */
.mockups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.mockup { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.mockup iframe, .mockup-missing { display: block; width: 100%; height: 200px; border: 0; background: #fff; }
.mockup-missing { display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.mockup figcaption { padding: 8px 12px; font-size: 13px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
/* An Artifact's page: its facts, its Links, and its prose as Markdown. */
h1 .id { font-family: var(--mono); font-size: .6em; font-weight: 600; color: var(--muted); vertical-align: middle; margin-right: 6px; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
ul.linked li { padding: 3px 0; font-size: 14px; }
a.id { font-family: var(--mono); font-size: 12.5px; font-weight: 500; }
#links h3, #linked-here h3 { margin: 12px 0 4px; }
#links h3:first-of-type, #linked-here h3:first-of-type { margin-top: 0; }
.prose { font-size: 15px; overflow-wrap: anywhere; }
.prose h1, .prose h2, .prose h3, .prose h4 { font-size: 16px; margin: 18px 0 8px; }
.prose > :first-child { margin-top: 0; }
.prose ul, .prose ol { padding-left: 22px; margin: 0 0 10px; }
.prose li:has(> input[type="checkbox"]) { list-style: none; margin-left: -20px; }
.prose table { width: auto; margin: 0 0 12px; display: block; overflow-x: auto; }
.prose pre { background: var(--bg); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
.prose pre code { background: none; padding: 0; color: inherit; }
.prose blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.comment { border-top: 1px solid var(--line-soft); padding-top: 10px; margin-top: 10px; }
.comment:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
form.comment-form { display: grid; gap: 8px; justify-items: start; }
form.comment-form textarea { box-sizing: border-box; width: 100%; font: 14px/1.5 var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
form.comment-form textarea:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); outline-offset: 0; }
/* The Timeline: a bar per Artifact across time, coloured by Status, hatched
   where it waited on a person, with agent session time in a band under it. */
:root { --s0: #8cc4e3; --s1: #0a86c9; --s2: #d99a2b; --s3: #0c8467; --s4: #8b67c9; --s5: #d0566f; --s6: #4fa5a0; --s7: #7c8b2f; --s-other: #9aaab5; --agent: #0d2b3e; }
@media (prefers-color-scheme: dark) {
  :root { --s0: #5a9fc4; --s1: #4cb6ee; --s2: #f5b454; --s3: #4fd1a5; --s4: #b393ec; --s5: #ff8aa0; --s6: #6fc8c2; --s7: #b6c45a; --s-other: #7d93a3; --agent: #e4f0f7; }
}
.tl { min-width: 640px; }
ul.timeline, ul.timeline ul { list-style: none; margin: 0; padding: 0; }
.tl-row { display: grid; grid-template-columns: minmax(180px, 32%) 1fr; align-items: center; gap: 12px; border-bottom: 1px solid var(--line-soft); }
.tl-axis { border-bottom: 1px solid var(--line); }
.tl-label { padding: 3px 0 3px calc(var(--depth, 0) * 18px); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-ends { display: flex; justify-content: space-between; padding: 4px 0; }
.tl-bar { display: block; overflow: visible; }
.tl-bar a:hover rect:not(.agent) { stroke: var(--text); stroke-width: 1; }
.tl-key { display: inline-flex; align-items: center; gap: 5px; margin-right: 8px; }
.tl-defs { position: absolute; }
rect.agent { fill: var(--agent); opacity: .75; }
.s0 { fill: var(--s0); } .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .s4 { fill: var(--s4); } .s5 { fill: var(--s5); } .s6 { fill: var(--s6); } .s7 { fill: var(--s7); } .s-other { fill: var(--s-other); }
.tl-defs pattern rect { fill: var(--panel); }
.tl-defs pattern line { stroke-width: 3; }
.tl-defs pattern.s0 line { stroke: var(--s0); } .tl-defs pattern.s1 line { stroke: var(--s1); } .tl-defs pattern.s2 line { stroke: var(--s2); } .tl-defs pattern.s3 line { stroke: var(--s3); } .tl-defs pattern.s4 line { stroke: var(--s4); } .tl-defs pattern.s5 line { stroke: var(--s5); } .tl-defs pattern.s6 line { stroke: var(--s6); } .tl-defs pattern.s7 line { stroke: var(--s7); } .tl-defs pattern.s-other line { stroke: var(--s-other); }
rect.hatched { stroke-width: 1; }
/* A presentation attribute gives way to any CSS, so the hatching is set here too. */
rect.hatched.s0 { fill: url(#hatch-s0); stroke: var(--s0); } rect.hatched.s1 { fill: url(#hatch-s1); stroke: var(--s1); } rect.hatched.s2 { fill: url(#hatch-s2); stroke: var(--s2); } rect.hatched.s3 { fill: url(#hatch-s3); stroke: var(--s3); } rect.hatched.s4 { fill: url(#hatch-s4); stroke: var(--s4); } rect.hatched.s5 { fill: url(#hatch-s5); stroke: var(--s5); } rect.hatched.s6 { fill: url(#hatch-s6); stroke: var(--s6); } rect.hatched.s7 { fill: url(#hatch-s7); stroke: var(--s7); } rect.hatched.s-other { fill: url(#hatch-s-other); stroke: var(--s-other); }
@media (max-width: 560px) {
  header .bar { justify-content: flex-start; }
  h1 { font-size: 24px; }
  .panel { padding: 16px; border-radius: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:active { transform: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="name"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="6" fill="var(--accent)"/><path d="M6 8h6.5a2.5 2.5 0 0 1 0 5H9.5a2.5 2.5 0 0 0 0 5H16" fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>JigFlow <span>{{.Playbook}}</span></div>
    <nav>
      <a href="/"{{if eq .Page "backlog"}} aria-current="page"{{end}}>Backlog</a>
      <a href="/timeline"{{if eq .Page "timeline"}} aria-current="page"{{end}}>Timeline</a>
      {{if git}}<a href="/git"{{if eq .Page "git"}} aria-current="page"{{end}}>Git</a>{{end}}
      {{if design}}<a href="/design"{{if eq .Page "design"}} aria-current="page"{{end}}>Design</a>{{end}}
      <a href="/playbook"{{if eq .Page "playbook"}} aria-current="page"{{end}}>Playbook</a>
      <a href="/workflows"{{if eq .Page "workflows"}} aria-current="page"{{end}}>Workflows</a>
      <a href="/ledger"{{if eq .Page "ledger"}} aria-current="page"{{end}}>Ledger</a>
    </nav>
  </div>
</header>
<div class="changed" id="changed" role="status" hidden>
  <span><strong>The project changed</strong> since this page was shown. Your edits stay until you reload.</span> <a href="{{.Here}}">Reload</a>
</div>
<main>
{{template "content" .}}
</main>
<script>
// The page updates itself when the project changes (ADR 0025): it asks jfl
// ui on /changes whether something changed since what it shows (ADR 0029),
// and loads again, where the person was on it. With JavaScript off it works
// the same, reloaded by hand.
(function () {
  var here = {{.Here}}, key = "jfl-dashboard-scroll";
  try {
    var kept = JSON.parse(sessionStorage.getItem(key));
    sessionStorage.removeItem(key);
    if (kept) addEventListener("load", function () { scrollTo(kept.x, kept.y); });
  } catch (e) {}
  // reload loads the page again as a GET of the page it shows: after a
  // decision, the backlog, never the form posted again.
  function reload() {
    try { sessionStorage.setItem(key, JSON.stringify({x: scrollX, y: scrollY})); } catch (e) {}
    location.replace(here + location.hash);
  }
  // edited reports whether the person changed a field of any form on the
  // page: a Proposal's, before approving it, or a comment being written.
  function edited() {
    return Array.prototype.some.call(document.forms, function (f) {
      return Array.prototype.some.call(f.elements, function (el) {
        if (el.type === "select-one") {
          // With no option marked selected, the first one is.
          var shown = 0;
          Array.prototype.forEach.call(el.options, function (o, i) { if (o.defaultSelected) shown = i; });
          return el.selectedIndex !== shown;
        }
        if (el.type === "checkbox" || el.type === "radio") return el.checked !== el.defaultChecked;
        return "defaultValue" in el && el.value !== el.defaultValue;
      });
    });
  }
  // changed is what the page does when the project changed: loads again,
  // unless that would lose edits, when the bar says so and offers to.
  var bar = document.getElementById("changed");
  bar.querySelector("a").addEventListener("click", function (e) { e.preventDefault(); reload(); });
  function changed() {
    if (edited()) bar.hidden = false; else reload();
  }
  // The page asks every 2 seconds while its tab is visible, and once as
  // soon as it becomes visible again; a hidden tab doesn't ask, so that any
  // number of tabs hold no connection. It asks about what it shows, with
  // the same version while jfl ui doesn't answer, so that it catches up
  // on a change written meanwhile once jfl ui answers again.
  var asks = {{printf "/changes?since=%s" since}}, asking = true, inFlight = false, timer = null;
  function ask() {
    clearTimeout(timer);
    timer = null;
    if (!asking || inFlight || document.hidden) return;
    inFlight = true;
    fetch(asks, {cache: "no-store"}).then(function (r) {
      if (asking && r.status === 200) { asking = false; changed(); }
    }, function () {}).then(function () {
      inFlight = false;
      if (asking && !document.hidden) timer = setTimeout(ask, 2000);
    });
  }
  addEventListener("visibilitychange", function () {
    if (document.hidden) { clearTimeout(timer); timer = null; } else ask();
  });
  ask();
  // A decision submitted leaves for the page that says what it did, which
  // a change it makes itself must not replace.
  addEventListener("submit", function () { asking = false; clearTimeout(timer); });
})();
</script>
</body>
</html>
